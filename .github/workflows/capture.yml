name: Capture signal

# Cron de GitHub Actions (UTC). Cada 2 h al minuto 23.
#
# Por qué 2h y no 4h (cambiado 2026-08-26): los crons de Actions son best-effort
# y se observaron retrasos de 9-14 h con la cadencia de 4 h, lo que disparó falsas
# alarmas del heartbeat. Correr cada 2 h da el DOBLE de oportunidades de ponerse al
# día; como el backfill deduplica por vela, las corridas extra son inofensivas.
#
# Por qué el minuto 23: el minuto 0-1 es el slot más congestionado de la
# plataforma (todo el mundo programa ahí) y es donde más se encolan los retrasos.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: capture-signal
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture + backfill + evaluate
        run: python -m app.jobs.capture
        env:
          # Binance responde 451 (geobloqueo) desde la IP del runner de GitHub.
          # KuCoin es accesible globalmente y da el mismo régimen (OHLCV BTC/USDT
          # casi idéntico). El backtest/validación local siguen en Binance.
          EXCHANGE_ID: kucoin
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Alertas push (salientes). Si no defines los secrets de Telegram, el
          # envío se omite solo; el guardado en Supabase ocurre igual.
          TELEGRAM_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Registro de opiniones del LLM: OBSERVADOR, no decide nada. Acumula
          # muestra forward para poder medir algún día si la IA aporta (no se
          # puede validar hacia atrás sin lookahead). Si falta GROQ_API_KEY el
          # registro falla solo y se guarda como status=error; la captura sigue.
          AI_OPINION_LOGGING_ENABLED: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
